[package]
name = "goosenet"
version = "0.2.0"
edition = "2021"

[lib]
name = "goosenet"
crate-type = ["cdylib"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[profile.release]
opt-level = 2

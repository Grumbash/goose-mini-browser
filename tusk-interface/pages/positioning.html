<!doctype html>
<title>Positioning</title>
<style>
  body { margin: 0; padding: 24px; max-width: none; background: #1b1916; color: #efe7d8; font-family: sans-serif; font-size: 14px }
  .frame { position: relative; height: 260px; border: 2px solid #4a4339; border-radius: 10px; background: #24211d }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: #2d2924; border-bottom: 1px solid #4a4339 }
  .title { position: absolute; left: 14px; top: 9px; width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold }
  .badge { position: absolute; right: 10px; bottom: 10px; padding: 3px 8px; background: #e0a43a; color: #1b1916; border-radius: 9px }
  .card { position: absolute; top: 60px; width: 120px; height: 140px; border-radius: 14px; overflow: hidden; border: 2px solid #efe7d8 }
  .card .art { position: absolute; left: -20px; top: -20px; width: 100px; height: 100px; background: #c4472f; border-radius: 50px }
  .card .label { position: absolute; left: 10px; bottom: 8px; right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .one { left: 30px; z-index: 3; background: #3b5d4a }
  .two { left: 110px; z-index: 2; top: 76px; background: #34507a }
  .three { left: 190px; z-index: 1; top: 92px; background: #6b4b7a }
  .flow { margin: 180px 0 0 300px; width: 240px }
  .nudge { position: relative; top: -8px; left: 12px; color: #e0a43a }
  .pin { position: fixed; right: 16px; top: 16px; width: 12px; height: 12px; background: #e0a43a; border-radius: 6px }
</style>
<div class=frame>
  <div class=top><div class=title>A board title much too long to fit here</div></div>
  <div class="card one"><div class=art></div><div class=label>Overlapping card with a long label</div></div>
  <div class="card two"><div class=art></div><div class=label>Second</div></div>
  <div class="card three"><div class=art></div><div class=label>Third card</div></div>
  <p class=flow>Text in the flow, with <span class=nudge>a nudged span</span> that moves without moving the rest.</p>
  <div class=badge>42 KB</div>
</div>
<div class=pin></div>
